@media(min-width:1700px){.page{padding-inline:80px}}
@media(max-width:1050px){.gallery{grid-template-columns:repeat(2,minmax(0,1fr));gap:40px 25px}.circle{min-height:280px}.enso{max-width:310px}}
@media(max-width:600px){.page{padding-inline:24px}.masthead{height:88px}h1{font-size:13px;letter-spacing:.06em}main{padding:0 0 45px}.gallery{grid-template-columns:1fr;gap:34px}.circle{height:260px;min-height:0;margin-bottom:-2px}.enso{height:225px;width:225px}.snapshot{aspect-ratio:1.4}.caption{padding-top:14px}h2{font-size:18px}.domain{font-size:10px}.snapshot img{filter:grayscale(.65) brightness(.9)}footer{font-size:9px;padding:23px 0 28px}}
@media(hover:none){.snapshot img{filter:grayscale(.4) brightness(.95)}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{transition:none!important}}
